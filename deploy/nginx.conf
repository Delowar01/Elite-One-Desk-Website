# ---------------------------------------------------------------------------
# Elite One Desk — nginx site configuration
#
# Put this at /etc/nginx/sites-available/elite-one-desk and symlink it into
# sites-enabled. Certbot rewrites the listen/ssl lines the first time you run
# it; everything else here is ours.
# ---------------------------------------------------------------------------

# Rate-limit zone for the public enquiry endpoint. The application has its own
# limiter, but this one stops a flood before it reaches Node at all.
limit_req_zone $binary_remote_addr zone=eod_enquiries:10m rate=20r/m;

upstream elite_one_desk {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name eliteonedesk.com www.eliteonedesk.com;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eliteonedesk.com;

    ssl_certificate     /etc/letsencrypt/live/eliteonedesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eliteonedesk.com/privkey.pem;

    # One canonical host. Serving both is two sites as far as Google is concerned.
    return 301 https://eliteonedesk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eliteonedesk.com;

    ssl_certificate     /etc/letsencrypt/live/eliteonedesk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eliteonedesk.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The application sets its own CSP with a per-request nonce; adding one here
    # would override it with something weaker.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 12M;   # matches the 10 MB media cap, plus overhead
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # --- Uploaded media -----------------------------------------------------
    # Served straight off disk. The application exposes the same files at the
    # same addresses, so removing this block changes nothing but the speed.
    location /media/ {
        alias /var/www/elite-one-desk/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @app;
    }

    # --- Next.js build assets ----------------------------------------------
    # Content-hashed, so they are immutable by construction.
    location /_next/static/ {
        alias /var/www/elite-one-desk/app/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(fonts|brand)/ {
        root /var/www/elite-one-desk/app/public;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @app;
    }

    # --- The public enquiry endpoint ---------------------------------------
    location = /api/enquiries {
        limit_req zone=eod_enquiries burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://elite_one_desk;
        proxy_set_header X-Eod-Rewritten "";
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / { try_files $uri @app; }

    location @app {
        proxy_pass http://elite_one_desk;
        proxy_http_version 1.1;
        # Internal marker the application sets on its own sub-requests; a client
        # has no business sending it.
        proxy_set_header X-Eod-Rewritten "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
